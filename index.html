<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Quinn Nguyen">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Commission</title>
    </head>
    <body>
        <script>
            let subtotal = 0;
            let input;

            const username = prompt("What is your name?");

            do {
                input = prompt("Enter the dollar amount for your sales a single sale at a time. Enter done when you are finished.");
                if(input !== null && input.toLowerCase() !== "done") {
                    let sale = parseFloat(input);
                    if (!isNaN(sale) && sale > 0) {
                        subtotal += sale;
                    }
                }
            } while (input !== null && input.toLowerCase () !== "done");

            let commissionRate = 0;

            if (subtotal >= 1000) {
                comissionRate = 0.15;
            } else if (subtotal >= 500) {
                comissionRate = 0.10;
            } else if (subtotal > 0) {
                commissionRate = 0;
            }

            let comission = subtotal * comissionRate;
            let totalEarnings = subtotal + comission;

            document.write(
                "Hello " + username + ", here is your weekly comission report. <br>" +
                "Your sales total is $" + subtotal.toFixed(2) + ", so your commisionRate is" + (comissionRate * 100).toFixed(2) + "%.<br>" +
                "Your total comission is $" + commission.toFixed(2) + ".<br>" +
                "Your total earnings are $" + totalEarnings.toFixed(2) + "."
            )

        </script>
    </body>
</html>
